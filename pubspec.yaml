name: zataxo_pipeline
description: "Local CI runner for GitHub Actions-style workflows on macOS."
publish_to: "none"
version: 1.4.9+10

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  yaml: ^3.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  provider: ^6.1.2
  url_launcher: ^6.3.0
  code_text_field: ^1.1.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  uuid: ^4.5.1
  glob: ^2.1.2
  file_picker: ^8.1.2
  google_fonts: ^6.2.1
  package_info_plus: ^8.0.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
